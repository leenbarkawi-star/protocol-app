<title>Protocol</title>
<style>
:root{--bg:#f3ede1;--surface:#fbf8f1;--ink:#3b2e24;--muted:#7a6a5c;--sage:#5f7657;--line:#ddd2c0;--warn:#9a4f2c}
@media (prefers-color-scheme: dark){:root{--bg:#1f1915;--surface:#2b231c;--ink:#efe6d6;--muted:#b3a492;--sage:#a3b89a;--line:#45392e;--warn:#e0a07c;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
h1{font:600 1.6rem/1.2 Georgia,serif;margin:0}
p{margin:0;color:var(--muted);font-size:.9rem}
label{font-size:.84rem;color:var(--muted);font-weight:500}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;width:100%}
button{font:inherit;font-weight:600;background:var(--sage);color:var(--bg);border:0;border-radius:8px;padding:12px;cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
#err{color:var(--warn);font-size:.88rem;min-height:1.3em}
</style>
</head>

<form id="lock" hidden>
  <h1>Protocol</h1>
  <p>Enter your passcode once. This phone will remember it.</p>
  <label for="pass">Passcode</label>
  <input id="pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <button id="go" type="submit">Unlock</button>
  <div id="err" role="alert"></div>
</form>

      .then(function(buf){var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close()});
  }
  function show(msg){var f=document.getElementById('lock');f.hidden=false;document.getElementById('err').textContent=msg||'';document.getElementById('go').disabled=false}
  if(!S){show('This browser cannot unlock the app. Open it in Safari.');return}
  var saved=null;try{saved=localStorage.getItem(K)}catch(e){}
  if(saved)open(unhex(saved)).catch(function(){try{localStorage.removeItem(K)}catch(e){}show('')});else show('');
  document.getElementById('lock').addEventListener('submit',function(e){
    e.preventDefault();
    var p=document.getElementById('pass').value.toLowerCase().replace(/[^a-z0-9]/g,'');
    document.getElementById('go').disabled=true;document.getElementById('err').textContent='Unlocking.';
    S.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits'])
      .then(function(k){return S.deriveBits({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},k,256)})
      .then(function(bits){var u=new Uint8Array(bits);return open(u).then(function(){try{localStorage.setItem(K,hex(u))}catch(e){}})})
      .catch(function(){show('That passcode did not work. Check it and try again.')});
  });
})();
